<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#E6C260"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>

    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverGradFull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="silverShackleFull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Tricolor Ring Gradients -->
    <linearGradient id="saffronGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>

    <linearGradient id="greenGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Text Green Gradient -->
    <linearGradient id="textGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadowFull" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="240" height="240" rx="16" fill="#0B132B"/>

  <!-- Logo Circular Ring Section -->
  <g transform="translate(120, 75)" filter="url(#shadowFull)">
    <!-- Tricolor Ring Arcs -->
    <path d="M 0 -52 A 52 52 0 0 0 -47 -20" fill="none" stroke="url(#saffronGradFull)" stroke-width="6.5" stroke-linecap="round" filter="url(#glowFull)"/>
    <path d="M 0 -52 A 52 52 0 0 1 47 -20" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" filter="url(#glowFull)"/>
    <path d="M 47 -20 A 52 52 0 0 1 15 48" fill="none" stroke="url(#greenGradFull)" stroke-width="6.5" stroke-linecap="round" filter="url(#glowFull)"/>
    <path d="M -47 -20 A 52 52 0 0 0 -15 48" fill="none" stroke="#FFFFFF" stroke-dasharray="3 7" stroke-width="3.5" opacity="0.5"/>

    <!-- Ashoka Lions Emblem in Center -->
    <g transform="translate(0, -16) scale(0.85)">
      <path d="M -24 16 L 24 16 L 20 22 L -20 22 Z" fill="url(#goldGradFull)" stroke="#5C4033" stroke-width="0.8"/>
      <circle cx="0" cy="19" r="3.5" fill="none" stroke="#1E293B" stroke-width="0.8"/>
      <circle cx="0" cy="19" r="0.8" fill="#1E293B"/>
      <path d="M -18 22 C -10 26 10 26 18 22 C 14 28 -14 28 -18 22 Z" fill="url(#goldGradFull)"/>

      <path d="M -8 2 C -10 -8 0 -18 0 -18 C 0 -18 10 -8 8 2 C 7 7 6 12 6 16 L -6 16 C -6 12 -7 7 -8 2 Z" fill="url(#goldGradFull)" stroke="#4A3525" stroke-width="0.6"/>
      <path d="M 0 -18 C -4 -12 -5 -6 -4 0 C 0 4 4 4 4 0 C 5 -6 4 -12 0 -18 Z" fill="#FFF3B0" opacity="0.4"/>
      <circle cx="-2.5" cy="-12" r="1" fill="#3D2314"/>
      <circle cx="2.5" cy="-12" r="1" fill="#3D2314"/>

      <path d="M -8 4 C -16 0 -20 -10 -16 -16 C -12 -18 -8 -14 -6 -8 C -5 -4 -6 0 -8 4 Z" fill="url(#goldGradFull)" stroke="#4A3525" stroke-width="0.6"/>
      <circle cx="-13" cy="-12" r="0.9" fill="#3D2314"/>

      <path d="M 8 4 C 16 0 20 -10 16 -16 C 12 -18 8 -14 6 -8 C 5 -4 6 0 8 4 Z" fill="url(#goldGradFull)" stroke="#4A3525" stroke-width="0.6"/>
      <circle cx="13" cy="-12" r="0.9" fill="#3D2314"/>
    </g>

    <!-- Padlock at Bottom -->
    <g transform="translate(0, 22)">
      <path d="M -10 2 L -10 -7 A 10 10 0 0 1 10 -7 L 10 2" fill="none" stroke="url(#silverShackleFull)" stroke-width="4" stroke-linecap="round"/>
      <rect x="-15" y="0" width="30" height="24" rx="4" fill="url(#silverGradFull)" stroke="#475569" stroke-width="1"/>
      <rect x="-13" y="2" width="26" height="2" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="0" cy="9.5" r="2.8" fill="#0F172A"/>
      <path d="M -1.5 10.5 L 1.5 10.5 L 2 16.5 L -2 16.5 Z" fill="#0F172A"/>
    </g>
  </g>

  <!-- Typography Brand Name: GOVVault -->
  <g transform="translate(120, 185)" text-anchor="middle">
    <text x="0" y="0" font-family="'Inter', 'Outfit', system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">GOV</tspan>
      <tspan fill="url(#textGreenGrad)">Vault</tspan>
    </text>
    
    <!-- Subtitle: TRUSTED BY GOVERNMENT -->
    <text x="0" y="18" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="9" fill="#94A3B8" letter-spacing="2.5">
      TRUSTED BY GOVERNMENT
    </text>
  </g>
</svg>
