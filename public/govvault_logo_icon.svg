<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient for Emblem -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#E6C260"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>

    <!-- Metallic Silver Gradient for Lock -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="silverShackle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Tricolor Ring Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Circle (Optional Dark Container) -->
  <circle cx="60" cy="60" r="58" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Outer Tricolor Circular Ring Arc Segments -->
  <!-- Saffron Arc (Top Left) -->
  <path d="M 60 12 A 48 48 0 0 0 17 42" fill="none" stroke="url(#saffronGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- White Arc (Top Right) -->
  <path d="M 60 12 A 48 48 0 0 1 103 42" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Green Arc (Bottom Right) -->
  <path d="M 103 42 A 48 48 0 0 1 73 105" fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Left Ring Balance Accent -->
  <path d="M 17 42 A 48 48 0 0 0 47 105" fill="none" stroke="#FFFFFF" stroke-dasharray="2 6" stroke-width="3" opacity="0.6"/>

  <!-- Center State Emblem - Ashoka Lions Silhouette & Details -->
  <g transform="translate(60, 44) scale(0.72)" filter="url(#shadow)">
    <!-- Base Pedestal / Abacus -->
    <path d="M -24 16 L 24 16 L 20 22 L -20 22 Z" fill="url(#goldGrad)" stroke="#5C4033" stroke-width="0.8"/>
    
    <!-- Dharma Chakra Wheel in Pedestal -->
    <circle cx="0" cy="19" r="3.5" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="0" cy="19" r="0.8" fill="#1E293B"/>

    <!-- Bull (Left) & Horse (Right) Accents -->
    <path d="M -12 18 C -14 17 -16 19 -14 21" fill="none" stroke="#5C4033" stroke-width="0.8"/>
    <path d="M 12 18 C 14 17 16 19 14 21" fill="none" stroke="#5C4033" stroke-width="0.8"/>

    <!-- Lotus Base -->
    <path d="M -18 22 C -10 26 10 26 18 22 C 14 28 -14 28 -18 22 Z" fill="url(#goldGrad)"/>

    <!-- Center Lion -->
    <path d="M -8 2 C -10 -8 0 -18 0 -18 C 0 -18 10 -8 8 2 C 7 7 6 12 6 16 L -6 16 C -6 12 -7 7 -8 2 Z" fill="url(#goldGrad)" stroke="#4A3525" stroke-width="0.6"/>
    <!-- Center Lion Mane & Details -->
    <path d="M 0 -18 C -4 -12 -5 -6 -4 0 C 0 4 4 4 4 0 C 5 -6 4 -12 0 -18 Z" fill="#FFF3B0" opacity="0.4"/>
    <circle cx="-2.5" cy="-12" r="1" fill="#3D2314"/>
    <circle cx="2.5" cy="-12" r="1" fill="#3D2314"/>
    <path d="M -3 -8 Q 0 -6 3 -8" fill="none" stroke="#3D2314" stroke-width="0.8"/>

    <!-- Left Lion -->
    <path d="M -8 4 C -16 0 -20 -10 -16 -16 C -12 -18 -8 -14 -6 -8 C -5 -4 -6 0 -8 4 Z" fill="url(#goldGrad)" stroke="#4A3525" stroke-width="0.6"/>
    <circle cx="-13" cy="-12" r="0.9" fill="#3D2314"/>

    <!-- Right Lion -->
    <path d="M 8 4 C 16 0 20 -10 16 -16 C 12 -18 8 -14 6 -8 C 5 -4 6 0 8 4 Z" fill="url(#goldGrad)" stroke="#4A3525" stroke-width="0.6"/>
    <circle cx="13" cy="-12" r="0.9" fill="#3D2314"/>
  </g>

  <!-- Security Padlock Symbol at the Bottom -->
  <g transform="translate(60, 78)" filter="url(#shadow)">
    <!-- Padlock Shackle -->
    <path d="M -9 2 L -9 -6 A 9 9 0 0 1 9 -6 L 9 2" fill="none" stroke="url(#silverShackle)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Padlock Body -->
    <rect x="-14" y="0" width="28" height="22" rx="4" fill="url(#silverGrad)" stroke="#475569" stroke-width="1"/>
    
    <!-- Metallic Highlight Line -->
    <rect x="-12" y="2" width="24" height="2" fill="#FFFFFF" opacity="0.6"/>

    <!-- Keyhole -->
    <circle cx="0" cy="8.5" r="2.5" fill="#0F172A"/>
    <path d="M -1.5 9.5 L 1.5 9.5 L 2 15 L -2 15 Z" fill="#0F172A"/>
  </g>
</svg>
